name: Contribution snake
on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#39FF9C&color_dots=#1A2027,#5B6470,#9AA4AF,#E6EDF3,#39FF9C
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Redraw contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
